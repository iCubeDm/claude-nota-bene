<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nota Bene</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github-dark.min.css">
<style>
  /* palette borrowed from Plannotator's default theme (MIT/Apache) */
  :root {
    --background: oklch(0.15 0.02 260); --foreground: oklch(0.90 0.01 260);
    --card: oklch(0.22 0.02 260); --popover: oklch(0.28 0.025 260);
    --primary: oklch(0.75 0.18 280); --primary-fg: oklch(0.15 0.02 260);
    --muted: oklch(0.26 0.02 260); --muted-fg: oklch(0.72 0.02 260);
    --accent: oklch(0.70 0.20 60); --destructive: oklch(0.65 0.20 25); --success: oklch(0.72 0.17 150);
    --border: oklch(0.35 0.02 260); --border-soft: oklch(0.35 0.02 260 / .5);
    --code-bg: oklch(0.26 0.02 260); --side: oklch(0.22 0.02 260); /* Plannotator: chrome panels = card, only the canvas behind the paper is darkest */
    --font-sans: 'Inter', system-ui, sans-serif; --font-mono: 'Geist Mono', 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--background); color: var(--foreground);
    font: 14px/1.6 var(--font-sans); -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus { outline: none; } button:focus-visible { outline: 2px solid oklch(0.75 0.18 280 / .6); outline-offset: 1px; }
  svg.i { width: 12px; height: 12px; flex: none; }

  /* ---------- chrome: measured off Plannotator (header 48px card/50 + blur, buttons 28px r8, pills r6) ---------- */
  header { height: 48px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; position: relative; z-index: 6;
    background: oklch(0.22 0.02 260 / .5); backdrop-filter: blur(24px); border-bottom: 1px solid var(--border-soft);
    font-size: 12px; color: var(--muted-fg); }
  #logo { width: 24px; height: 24px; margin-right: -4px; }
  header b { color: var(--foreground); font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  header #root { font: 11px var(--font-mono); opacity: .7; }
  header #session { font: 11px var(--font-mono); }
  header .grow { flex: 1; }
  #conn { color: var(--accent); }
  /* shadcn-ish buttons: secondary (filled muted) and ghost */
  .hb { height: 28px; padding: 0 10px; border: 0; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px;
    font: 500 12.5px var(--font-sans); color: var(--muted-fg); background: var(--muted); transition: background .12s, color .12s; }
  .hb:hover:not(:disabled) { color: var(--foreground); background: oklch(0.30 0.02 260); }
  .hb.ghost { background: none; } .hb.ghost:hover:not(:disabled) { background: var(--muted); }
  .hb:disabled { opacity: .4; cursor: default; }
  .hb .i { width: 13px; height: 13px; }
  #stats { display: flex; align-items: center; gap: 12px; font: 11px var(--font-mono); color: var(--muted-fg); }
  .meter { display: inline-flex; align-items: center; gap: 6px; cursor: default; }
  .meter .bar { width: 44px; height: 4px; border-radius: 2px; background: var(--muted); overflow: hidden; }
  .meter .bar i { display: block; height: 100%; background: var(--primary); }
  .meter.warn .bar i { background: var(--accent); } .meter.hot .bar i { background: var(--destructive); }
  .meter.hot { color: var(--destructive); }
  .ibtn { border: 0; background: none; color: var(--muted-fg); width: 28px; height: 28px; border-radius: 8px; display: inline-grid; place-items: center; }
  .ibtn:hover:not(:disabled) { color: var(--foreground); background: var(--muted); }
  .ibtn:disabled { opacity: .35; cursor: default; }
  .ibtn .i { width: 14px; height: 14px; }
  .foot-row { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; min-height: 30px; }
  .foot-row .grow { flex: 1; }
  #stopBtn { padding: 4px 10px; display: grid; place-items: center; height: 40px; }
  #stopBtn:not(:disabled) { color: var(--destructive); background: oklch(0.65 0.20 25 / .14); }
  #stopBtn:disabled { opacity: .35; cursor: default; }
  #send { height: 40px; }
  #sessMenu [hidden] { display: none !important; }
  #sessMenu .grp { padding: 8px 8px 2px; font: 10px var(--font-mono); letter-spacing: .04em; color: var(--muted-fg); text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sessMenu .grp.here { color: var(--primary); }
  #sessFilter { width: 100%; background: var(--background); border: 1px solid var(--border-soft); border-radius: 5px; color: var(--foreground);
    font: 12px var(--font-sans); padding: 5px 8px; outline: none; margin-bottom: 4px; }
  #sessFilter:focus { border-color: var(--primary); }
  #sessBtn { border: 1px solid var(--border-soft); background: none; border-radius: 4px; font: 11px var(--font-mono); color: var(--muted-fg); padding: 1px 8px; }
  #sessBtn:hover:not(:disabled) { color: var(--foreground); border-color: var(--primary); }
  #sessBtn:disabled { opacity: .35; cursor: default; }
  /* shadcn DropdownMenu look */
  #sessMenu { position: fixed; top: 44px; z-index: 30; display: none; width: 460px; max-height: 70vh; overflow: auto; padding: 4px;
    background: var(--popover); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 32px rgba(0,0,0,.5); font: 13px var(--font-sans); }
  #sessMenu .item-s { display: flex; flex-direction: column; gap: 1px; width: 100%; text-align: left; border: 0; background: none;
    border-radius: 5px; padding: 6px 8px; color: var(--foreground); }
  #sessMenu .item-s:hover { background: var(--muted); }
  #sessMenu .item-s .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sessMenu .item-s .m { font: 10.5px var(--font-mono); color: var(--muted-fg); }
  #sessMenu .item-s.cur { cursor: default; background: oklch(0.75 0.18 280 / .12); }
  #sessMenu .sep { height: 1px; background: var(--border-soft); margin: 4px -4px; }
  #sessMenu .note { padding: 6px 8px; font-size: 11.5px; color: var(--muted-fg); }
  main { flex: 1; display: flex; min-height: 0; position: relative; }

  /* side panels float over the content (shadcn Sheet-style) — opening one never reflows the chat */
  .sheet { position: absolute; top: 40px; bottom: 0; z-index: 5; display: flex; flex-direction: column; min-height: 0;
    background: var(--side); box-shadow: 0 0 40px rgba(0,0,0,.35); transition: transform .18s ease, visibility .18s; }
  .sheet:not(.open) { visibility: hidden; box-shadow: none; }
  #side.sheet { left: 0; border-right: 1px solid var(--border); }
  #comments.sheet { right: 0; border-left: 1px solid var(--border); }
  #side.sheet:not(.open) { transform: translateX(-100%); }
  #comments.sheet:not(.open) { transform: translateX(100%); }
  /* panel toggles = Plannotator header icon buttons: active one tinted primary */
  .sheet-btn { flex: none; align-self: center; height: 28px; min-width: 28px; padding: 0 8px; border: 0; border-radius: 8px; background: none;
    color: var(--muted-fg); font: 500 12.5px var(--font-sans); display: inline-flex; gap: 6px; align-items: center; justify-content: center; }
  .sheet-btn:hover { color: var(--foreground); background: var(--muted); }
  .sheet-btn.on { color: var(--primary); background: oklch(0.75 0.18 280 / .15); }
  .sheet-btn .i { width: 14px; height: 14px; }

  /* ---------- file tree ---------- */
  #side { width: 260px; }
  .side-head, .c-head { height: 41px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 14px;
    border-bottom: 1px solid var(--border-soft); font-size: 13px; font-weight: 500; color: var(--foreground); }
  .side-head button { border: 0; background: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--muted-fg); }
  .side-head button:hover { background: var(--muted); color: var(--foreground); }
  .side-head .grow { flex: 1; }
  #sRefresh.spin svg { animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .filter { margin: 10px 8px 6px; height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 8px;
    background: oklch(0.26 0.02 260 / .5); color: var(--muted-fg); border: 1px solid transparent; }
  .filter:focus-within { border-color: oklch(0.75 0.18 280 / .5); }
  .filter input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--foreground); font: 12.5px var(--font-sans); }
  #tree { flex: 1; overflow: auto; padding: 2px 6px 12px; }
  .node { display: flex; align-items: center; gap: 6px; width: 100%; height: 24px; padding-right: 8px; border: 0; background: none;
    border-radius: 4px; font-size: 12px; text-align: left; color: oklch(0.90 0.01 260 / .85); }
  .node:hover { background: oklch(0.26 0.02 260 / .5); color: var(--foreground); }
  .node.active { background: oklch(0.75 0.18 280 / .14); color: var(--foreground); }
  .node.dot { opacity: .5; }
  .node .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .chev { transition: transform .12s; color: oklch(0.72 0.02 260 / .7); }
  .node.open .chev { transform: rotate(90deg); }
  .node .ico { color: oklch(0.72 0.02 260 / .6); }
  .node.dir .ico { color: oklch(0.75 0.18 280 / .75); }
  .badge { min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; font-size: 9px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; background: oklch(0.70 0.20 60 / .18); color: var(--accent); }

  /* ---------- center: tabs ---------- */
  #center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #tabs { height: 40px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 8px; border-bottom: 1px solid var(--border-soft);
    background: oklch(0.22 0.02 260 / .3); overflow-x: auto; }
  .tab { flex: none; height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 10px; border: 0; border-radius: 8px;
    background: none; font: 500 12.5px var(--font-sans); color: var(--muted-fg); white-space: nowrap; max-width: 260px; }
  .tab .t { overflow: hidden; text-overflow: ellipsis; }
  .tab:hover { color: var(--foreground); }
  .tab:hover { background: oklch(0.26 0.02 260 / .5); }
  .tab.active { background: oklch(0.75 0.18 280 / .12); color: var(--primary); }
  .tab.playing::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); animation: pulse 1.2s infinite; flex: none; }
  .tab .x { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; opacity: .5; }
  .tab .x:hover { opacity: 1; background: var(--muted); }
  #tabs .spacer { flex: 1; }
  #panes { flex: 1; position: relative; min-height: 0; }
  .pane { position: absolute; inset: 0; overflow: auto; display: none; }
  .pane.active { display: block; }
  .col { max-width: 860px; margin: 0 auto; padding: 0 24px; }
  .file-pane { padding: 20px 24px; }
  .file-pane img, .file-pane video { max-width: 100%; max-height: calc(100vh - 220px); display: block; margin: 0 auto; border-radius: 6px; }
  .file-pane audio { width: 100%; }
  .file-pane > pre { margin: 0; }
  .file-pane .md { max-width: 860px; margin: 0 auto; }

  /* ---------- chat feed ---------- */
  /* Plannotator look: content sits on a soft "paper" card over a faint grid, body text at 90% */
  .pane { background-color: var(--background);
    background-image: linear-gradient(oklch(0.90 0.01 260 / .035) 1px, transparent 1px), linear-gradient(90deg, oklch(0.90 0.01 260 / .035) 1px, transparent 1px);
    background-size: 24px 24px; background-attachment: local; }
  #items, .file-pane > .md { background: var(--card); border: 1px solid var(--border-soft); border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.25);
    color: oklch(0.90 0.01 260 / .9); font-size: 15px; line-height: 1.625; }
  #items { padding: 20px 40px 28px; margin: 16px auto 24px; }
  .file-pane > .md { max-width: 860px; margin: 0 auto; padding: 28px 48px; }
  .item { margin: 10px 0; }
  .meta { font: 10.5px var(--font-mono); color: var(--muted-fg); margin-bottom: 2px; }
  .user { background: oklch(0.26 0.02 260 / .55); border: 1px solid var(--border-soft); border-radius: 10px; padding: 8px 12px; white-space: pre-wrap; }
  .user details { margin-top: 6px; font-size: 13px; white-space: normal; }
  .user summary { cursor: pointer; color: var(--muted-fg); font-size: 12px; }
  .user details blockquote { margin: 6px 0 2px; padding-left: 8px; border-left: 2px solid var(--accent); color: var(--muted-fg); }
  .md p { margin: .5em 0; }
  .md h1, .md h2, .md h3 { line-height: 1.3; margin: 1em 0 .4em; }
  .md pre { background: var(--code-bg); border: 1px solid var(--border-soft); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
  .md code, pre code { font: 12.5px/1.5 var(--font-mono); }
  .md :not(pre) > code { background: var(--muted); padding: 1px 5px; border-radius: 4px; color: oklch(0.72 0.02 260); font-size: 12px; }
  .md pre code.hljs { background: none; padding: 0; }
  .md code.file-ref { cursor: pointer; text-decoration: underline dotted var(--accent); }
  .md code.file-ref.missing { cursor: not-allowed; text-decoration: line-through; opacity: .6; }
  .md img, .md video { max-width: 100%; max-height: 380px; border-radius: 8px; display: block; margin: 8px 0; cursor: zoom-in; }
  .md video { cursor: default; }
  .md audio { width: 100%; }
  .md table { border-collapse: collapse; } .md td, .md th { border: 1px solid var(--border); padding: 4px 8px; }
  .md a { color: var(--primary); }
  .md blockquote { border-left: 2px solid var(--border); margin: .5em 0; padding-left: 12px; color: var(--muted-fg); }
  .mermaid-out, .svg-out { background: oklch(0.97 0.005 260); border-radius: 8px; padding: 12px; overflow-x: auto; margin: 8px 0; }
  .mermaid-out { background: oklch(0.19 0.02 260); border: 1px solid var(--border-soft); }
  .tool { font: 11.5px/1.5 var(--font-mono); color: var(--muted-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tool.sub { padding-left: 20px; opacity: .65; }
  .done { font: 10.5px var(--font-mono); color: var(--muted-fg); border-top: 1px dashed var(--border-soft); padding-top: 4px; margin-top: 16px; }
  .err { color: var(--destructive); white-space: pre-wrap; font: 12px var(--font-mono); }
  .perm { border: 1px solid var(--accent); border-radius: 10px; padding: 8px 12px; font-size: 13px; background: var(--card); }
  .perm.plan { border-color: oklch(0.78 0.12 185 / .7); }
  .perm.plan .md { margin: 8px 0 10px; padding: 10px 14px; background: oklch(0.15 0.02 260 / .6); border-radius: 8px; max-height: 60vh; overflow: auto; }
  /* permission mode pill (Shift+Tab), colours as in the CLI's mode line */
  #modeBtn { height: 26px; padding: 0 10px; border: 1px solid var(--border-soft); border-radius: 999px; background: none; color: var(--muted-fg);
    font: 500 12px var(--font-sans); display: inline-flex; align-items: center; gap: 6px; }
  #modeBtn:hover { color: var(--foreground); background: var(--muted); }
  #modeBtn::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .8; }
  #modeBtn.m-acceptEdits { color: var(--primary); border-color: oklch(0.75 0.18 280 / .45); }
  #modeBtn.m-plan { color: oklch(0.80 0.12 185); border-color: oklch(0.78 0.12 185 / .45); }
  #modeBtn.m-auto { color: oklch(0.84 0.13 80); border-color: oklch(0.82 0.13 80 / .4); }
  #modeMenu { position: fixed; z-index: 25; display: none; width: 340px; padding: 4px; background: var(--popover); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: 0 10px 32px rgba(0,0,0,.5); }
  #modeMenu button { display: block; width: 100%; text-align: left; border: 0; background: none; border-radius: 6px; padding: 7px 10px; color: var(--foreground); }
  #modeMenu button:hover, #modeMenu button.cur { background: var(--muted); }
  #modeMenu b { font: 500 13px var(--font-sans); } #modeMenu span { display: block; font-size: 11.5px; color: var(--muted-fg); margin-top: 2px; line-height: 1.4; }
  .perm pre { margin: 6px 0; white-space: pre-wrap; max-height: 200px; overflow: auto; font: 12px var(--font-mono); }
  .perm.resolved { border-color: var(--border-soft); opacity: .6; }
  .btn { background: var(--muted); border: 1px solid transparent; border-radius: 8px; padding: 4px 12px; font: 500 13px var(--font-sans); color: var(--muted-fg); }
  .btn:hover:not(:disabled) { color: var(--foreground); background: oklch(0.30 0.02 260); }
  .btn.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
  .btn.primary:hover:not(:disabled) { background: oklch(0.80 0.16 280); color: var(--primary-fg); }
  .btn.primary:disabled { opacity: .4; cursor: default; }
  /* comment marks are drawn as rounded boxes over the text: ::highlight() can't do border-radius */
  .hl-layer { position: absolute; left: 0; top: 0; pointer-events: none; }
  .hl-mark { position: absolute; border-radius: 4px; }
  .hl-mark.pending { background: oklch(0.88 0.18 95 / .38); }
  .hl-mark.sent { background: oklch(0.75 0.18 280 / .18); }

  /* ---------- composer ---------- */
  footer { flex: none; border-top: 1px solid var(--border-soft); background: oklch(0.22 0.02 260 / .5); backdrop-filter: blur(24px); }
  #status { font-size: 12px; color: var(--muted-fg); display: flex; gap: 10px; align-items: center; min-height: 0; }
  #status:not(:empty) { padding-top: 8px; }
  #status .spin { color: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  #composer { display: flex; gap: 8px; padding: 10px 0 6px; align-items: flex-end; }
  #text { flex: 1; resize: none; min-height: 40px; max-height: 40vh; background: oklch(0.15 0.02 260 / .7); color: var(--foreground);
    border: 1px solid var(--border-soft); border-radius: 10px; padding: 9px 12px; font: inherit; transition: border-color .12s, box-shadow .12s; }
  .ta-wrap { flex: 1; position: relative; display: flex; }
  .ta-wrap #text { width: 100%; }
  .ta-wrap.has-sug #text { padding-right: 64px; }
  .ta-wrap.has-sug #text::placeholder { color: var(--foreground); opacity: .45; }
  #sugHint { display: none; position: absolute; right: 10px; bottom: 10px; font: 10.5px var(--font-mono); color: var(--muted-fg);
    background: var(--muted); border-radius: 4px; padding: 1px 6px; pointer-events: none; }
  .ta-wrap.has-sug:has(#text:placeholder-shown) #sugHint { display: block; }
  #text:focus { outline: none; border-color: oklch(0.75 0.18 280 / .6); box-shadow: 0 0 0 3px oklch(0.75 0.18 280 / .12); }
  .hint { font-size: 10.5px; color: var(--muted-fg); padding-bottom: 8px; }
  /* pasted / dropped images: thumbnails in the composer, the comment popup, cards and sent messages */
  .thumbs { display: flex; flex-wrap: wrap; gap: 6px; }
  .thumbs:empty { display: none; }
  #attach { padding-top: 10px; }
  .thumb { position: relative; width: 56px; height: 56px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-soft); background: var(--muted); flex: none; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
  .thumb button { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border: 0; border-radius: 6px; padding: 0;
    display: grid; place-items: center; background: oklch(0.15 0.02 260 / .8); color: var(--foreground); opacity: 0; transition: opacity .1s; }
  .thumb:hover button { opacity: 1; }
  .thumb button:hover { background: var(--destructive); }
  .user .thumbs { margin-top: 8px; white-space: normal; }
  .user .thumb { width: 96px; height: 96px; }
  .card .thumbs, #pop .thumbs { margin-top: 6px; }
  .card .thumb { width: 44px; height: 44px; }
  footer.drop, #pop.drop { box-shadow: inset 0 0 0 2px oklch(0.75 0.18 280 / .6); }
  /* @-mention file picker, like Claude Code's */
  #atMenu { position: fixed; z-index: 25; display: none; width: 440px; max-height: 320px; overflow: auto; padding: 4px;
    background: var(--popover); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 32px rgba(0,0,0,.5); }
  #atMenu .at { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: left; padding: 5px 8px;
    border-radius: 6px; color: var(--foreground); font: 12.5px var(--font-mono); white-space: nowrap; overflow: hidden; }
  #atMenu .at .ico { flex: none; color: var(--muted-fg); width: 14px; height: 14px; }
  #atMenu .at .d { color: var(--muted-fg); overflow: hidden; text-overflow: ellipsis; direction: rtl; }
  #atMenu .at.sel { background: oklch(0.75 0.18 280 / .15); }
  #atMenu .at mark { background: none; color: var(--primary); font-weight: 600; }
  #atMenu .note { color: var(--muted-fg); font-size: 12px; padding: 6px 8px; }
  .user .mention { color: var(--primary); cursor: pointer; font-family: var(--font-mono); font-size: .92em; }
  .user .mention:hover { text-decoration: underline; }
  /* server errors: toasts top-right, the server keeps running */
  #toasts { position: fixed; top: 56px; right: 16px; z-index: 40; display: flex; flex-direction: column; gap: 8px; width: 380px; pointer-events: none; }

  document.querySelectorAll('[data-i]').forEach((el) => { el.innerHTML = t(el.dataset.i); });
  document.querySelectorAll('[data-i-tip]').forEach((el) => { el.dataset.tip = t(el.dataset.iTip); });
  document.querySelectorAll('[data-i-ph]').forEach((el) => { el.placeholder = t(el.dataset.iPh); });
  document.querySelectorAll('[data-i-title]').forEach((el) => { el.title = t(el.dataset.iTitle); });
  $('langBtn').textContent = lang === 'ru' ? 'EN' : 'RU';
}
applyLang();
const items = $('items'), chatPane = $('pane-chat');
const VIDEO = /\.(mp4|mov|webm|m4v)$/i, AUDIO = /\.(mp3|wav|m4a|ogg)$/i, IMAGE = /\.(png|jpe?g|gif|webp|svg)$/i;
const TEXT = /\.(md|txt|json|js|mjs|ts|tsx|jsx|py|sh|css|html|yml|yaml|toml|csv|srt|log)$|^[^.]+$|^\.[^.]+$/i;
const fileUrl = (p) => /^(https?:|data:|blob:)/.test(p) ? p : `/file?path=${encodeURIComponent(decodeURI(p))}`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ICON = {
  chev: '<svg class="i chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 6 6 6-6 6"/></svg>',
  dir: '<svg class="i ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  file: '<svg class="i ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
  media: '<svg class="i ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>',
  img: '<svg class="i ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>',
  chat: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
  pencil: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  trash: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>',
  check: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>',
  cross: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  help: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><path d="M12 17h.01"/></svg>',
  x: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:10px;height:10px"><path d="M18 6 6 18M6 6l12 12"/></svg>',
};
const fileIcon = (n) => VIDEO.test(n) || AUDIO.test(n) ? ICON.media : IMAGE.test(n) ? ICON.img : ICON.file;

// ---------- markdown ----------
marked.use({ gfm: true, renderer: {
  image(href, title, text) {
    href = typeof href === 'object' ? href.href : href;
    const src = fileUrl(href);
    if (VIDEO.test(href)) return `<video controls preload="metadata" src="${src}"></video>`;
    if (AUDIO.test(href)) return `<audio controls src="${src}"></audio>`;
    return `<img src="${src}" alt="${text || ''}">`;
  },
}});

function renderMd(el, text, final) {
  el.innerHTML = DOMPurify.sanitize(marked.parse(text), { ADD_TAGS: ['video', 'audio'], ADD_ATTR: ['controls', 'preload'] });
  el.querySelectorAll('pre code').forEach((c) => {
    const lang = (c.className.match(/language-(\w+)/) || [])[1];
    if (final && lang === 'mermaid') {
      const out = document.createElement('div'); out.className = 'mermaid-out';
      mermaid.render('m' + Math.random().toString(36).slice(2), c.textContent)
        .then(({ svg }) => { out.innerHTML = svg; })
        .catch((e) => { out.textContent = 'mermaid error: ' + e.message; });
      c.parentElement.replaceWith(out);
    } else if (final && lang === 'svg') {
      const out = document.createElement('div'); out.className = 'svg-out';
      out.innerHTML = DOMPurify.sanitize(c.textContent, { USE_PROFILES: { svg: true, svgFilters: true } });
      c.parentElement.replaceWith(out);
    } else {
      hljs.highlightElement(c);
    }
  });
  el.querySelectorAll(':not(pre) > code').forEach((c) => {
    if (isPath(c.textContent.trim())) c.classList.add('file-ref');
  });
}

// media in the chat opens as a file tab
chatPane.addEventListener('click', (e) => {
  if (!window.getSelection().isCollapsed) return;
  const c = e.target.closest('code.file-ref');
  if (c) return openRef(c.textContent.trim().replace(/^\.\//, ''), c);
  const a = e.target.closest('.md a[href]');
  if (a && !/^(https?:|mailto:|#)/.test(a.getAttribute('href'))) {
    e.preventDefault(); return openRef(decodeURI(a.getAttribute('href')).replace(/^\.\//, ''), a);
  }
  const img = e.target.closest('.md img');
  if (img) { const p = new URL(img.src).searchParams.get('path'); if (p) openFile(p); }
});

// project-relative path in `code` or a relative link → file tab; ~/… and /… are outside the project
function isPath(p) {
  return !/^(https?:|~|\/)/.test(p) && !/[\n`<>|*]/.test(p) && (/\//.test(p) || /\.[a-z0-9]{1,5}$/i.test(p));
}
async function openRef(p, el) {
  const ok = await fetch(fileUrl(p), { method: 'HEAD' }).then((r) => r.ok, () => false);
  if (ok) return openFile(p);
  el.classList.add('missing'); el.title = t('noFile');
}

// ---------- tabs ----------
const tabs = [{ id: 'chat', title: null, pane: chatPane }]; // null = no session title yet → localized «Chat»
let activeTab = 'chat';

function renderTabs() {
  const bar = $('tabs'); bar.innerHTML = '';
  const ts = document.createElement('button'); ts.id = 'toggleSide';
  ts.className = 'sheet-btn' + ($('side').classList.contains('open') ? ' on' : ''); ts.title = t('files');
  ts.innerHTML = ICON.dir; ts.onclick = () => togglePanel('side');
  bar.append(ts);
  for (const tb of tabs) {
    const b = document.createElement('button');
    b.className = 'tab' + (tb.id === activeTab ? ' active' : '');
    const title = tb.title ?? t('chat');
    b.title = tb.id === 'chat' ? (tb.title ?? t('chatTip')) : tb.id;
    const playing = [...tb.pane.querySelectorAll('video, audio')].some((m) => !m.paused);
    b.classList.toggle('playing', playing && tb.id !== activeTab);
    b.innerHTML = (tb.id === 'chat' ? ICON.chat : fileIcon(title)) + `<span class="t">${esc(title)}</span>` + (tb.id === 'chat' ? '' : `<span class="x" title="${t('close')}">${ICON.x}</span>`);
    b.onclick = (e) => e.target.closest('.x') ? closeTab(tb.id) : activate(tb.id);
    b.onauxclick = (e) => { if (e.button === 1 && tb.id !== 'chat') closeTab(tb.id); };
    bar.append(b);
  }
  bar.insertAdjacentHTML('beforeend', '<span class="spacer"></span>');
  const tg = document.createElement('button'); tg.id = 'toggleComments';
  tg.className = 'sheet-btn' + ($('comments').classList.contains('open') ? ' on' : '');
  tg.innerHTML = `${t('comments')}${comments.length ? ` <span class="badge">${comments.length}</span>` : ''}`;
  tg.onclick = () => togglePanel('comments');
  bar.append(tg);
}

// panels remember open/closed across reloads
function togglePanel(id, open) {
  const on = $(id).classList.toggle('open', open);
  localStorage.setItem('panel:' + id, on ? '1' : '0');
  renderTabs();
}
$('sClose').onclick = () => togglePanel('side', false);
$('sRefresh').onclick = () => refreshTree();

// leaving a tab doesn't stop its media: a playing video moves to picture-in-picture (allowed here because the
// switch comes from a click), audio keeps playing; the tab shows a ▶ mark. Coming back closes the PiP window.
function activate(id) {
  activeTab = id;
  for (const tb of tabs) {
    const on = tb.id === id;
    if (on && tb.pane.contains(document.pictureInPictureElement)) document.exitPictureInPicture().catch(() => {});
    if (!on && tb.pane.classList.contains('active')) {
      const playing = [...tb.pane.querySelectorAll('video')].filter((v) => !v.paused && v !== document.pictureInPictureElement);
      const [pip, ...rest] = playing;
      rest.forEach((v) => v.pause()); // the browser has one PiP window
      if (pip) {
        if (document.pictureInPictureEnabled && !pip.disablePictureInPicture) pip.requestPictureInPicture().catch(() => pip.pause());
        else pip.pause();
      }
    }
    tb.pane.classList.toggle('active', on);
  }
  document.querySelectorAll('.node.active').forEach((n) => n.classList.remove('active'));
  if (id !== 'chat') document.querySelector(`.node[data-path="${CSS.escape(id)}"]`)?.classList.add('active');
  renderTabs(); paintHl();
}

function closeTab(id) {
  const i = tabs.findIndex((t) => t.id === id);
  if (i <= 0) return;
  const pane = tabs[i].pane;
  if (pane.contains(document.pictureInPictureElement)) document.exitPictureInPicture().catch(() => {});
  pane.querySelectorAll('video, audio').forEach((m) => m.pause());
  pane.remove(); tabs.splice(i, 1);
  for (const c of comments) if (c.tab === id) c.range = null;
  for (let j = sent.length - 1; j >= 0; j--) if (sent[j].pane === pane) sent.splice(j, 1);
  if (activeTab === id) activate(tabs[Math.min(i, tabs.length - 1)].id); else renderTabs();
}

async function openFile(p) {
  if (tabs.some((t) => t.id === p)) return activate(p);
  const pane = document.createElement('div'); pane.className = 'pane file-pane'; pane.dataset.path = p;
  $('panes').append(pane);
  tabs.push({ id: p, title: p.split('/').pop(), pane });
  activate(p);
  const src = fileUrl(p), name = p.split('/').pop();
  if (VIDEO.test(p)) pane.innerHTML = `<video controls autoplay src="${src}"></video>`;
  else if (AUDIO.test(p)) pane.innerHTML = `<audio controls autoplay src="${src}"></audio>`;
  else if (IMAGE.test(p)) pane.innerHTML = `<img src="${src}">`;
  else if (TEXT.test(name)) {
    const text = await fetch(src).then((r) => r.text());
    if (/\.md$/i.test(p)) { pane.innerHTML = '<div class="md"></div>'; renderMd(pane.firstChild, text, true); }
    else {
      const lang = (p.match(/\.(\w+)$/) || [])[1];
      pane.innerHTML = '<pre class="md"><code></code></pre>';
      const code = pane.querySelector('code'); code.textContent = text.slice(0, 500000);
      if (lang && hljs.getLanguage(lang)) code.className = 'language-' + lang;
      hljs.highlightElement(code);
    }
  } else pane.innerHTML = `<div class="empty">${t('noPreview')}</div>`;
}

// the ▶ mark on tabs follows play/pause anywhere (media events don't bubble, so listen in capture)
for (const ev of ['play', 'pause', 'ended', 'emptied']) document.addEventListener(ev, () => renderTabs(), true);
// PiP window: «back to tab» keeps it playing → open its tab; closing it pauses, so nothing to do then
document.addEventListener('leavepictureinpicture', (e) => {
  const v = e.target;
  setTimeout(() => { if (!v.paused && v.isConnected) { const tb = tabs.find((x) => x.pane.contains(v)); if (tb && tb.id !== activeTab) activate(tb.id); } }, 50);
}, true);

// ---------- file tree ----------
// reopen: paths of folders to expand again after a refresh (the tree keeps its shape)
async function loadDir(rel, container, depth, reopen) {
  const list = await fetch(`/tree?path=${encodeURIComponent(rel)}`).then((r) => r.json());
  container.innerHTML = '';
  const again = [];
  for (const e of list) {
    const p = rel ? `${rel}/${e.name}` : e.name;
    const row = document.createElement('button');
    row.className = 'node' + (e.dir ? ' dir' : '') + (e.name.startsWith('.') ? ' dot' : '') + (p === activeTab ? ' active' : '');
    row.style.paddingLeft = `${6 + depth * 12}px`;
    row.dataset.path = p; row.dataset.name = e.name.toLowerCase();
    row.innerHTML = (e.dir ? ICON.chev + ICON.dir : `<span style="width:12px"></span>` + fileIcon(e.name)) + `<span class="name">${esc(e.name)}</span>`;
    container.append(row);
    if (e.dir) {
      const kids = document.createElement('div'); kids.hidden = true; container.append(kids);
      row.onclick = async () => {
        kids.hidden = !kids.hidden;
        row.classList.toggle('open', !kids.hidden);
        if (!kids.hidden) { await loadDir(p, kids, depth + 1); applyFilter(); paintBadges(); } // reload so new files show up
      };
      if (reopen?.has(p)) { kids.hidden = false; row.classList.add('open'); again.push(loadDir(p, kids, depth + 1, reopen)); }
    } else {
      row.onclick = () => openFile(p);
    }
  }
  await Promise.all(again);
}

// ↻ in the panel head, and on its own after every agent turn (that's when files usually appear)
let treeBusy = null;
function refreshTree() {
  if (treeBusy) return treeBusy;
  const open = new Set([...document.querySelectorAll('#tree .node.dir.open')].map((n) => n.dataset.path));
  const tree = $('tree'), y = tree.scrollTop;
  $('sRefresh').classList.add('spin');
  treeBusy = loadDir('', tree, 0, open)
    .then(() => { tree.scrollTop = y; applyFilter(); paintBadges(); }, (e) => toast(t('serverError', '/tree'), String(e)))
    .finally(() => { treeBusy = null; $('sRefresh').classList.remove('spin'); });
  return treeBusy;
}

// filters the rows that are already loaded (expanded folders)
function applyFilter() {
  const f = $('filter').value.trim().toLowerCase();
  document.querySelectorAll('#tree .node').forEach((n) => {
    n.style.display = !f || n.classList.contains('dir') || n.dataset.name.includes(f) ? '' : 'none';
  });
}
$('filter').addEventListener('input', applyFilter);

function paintBadges() {
  document.querySelectorAll('#tree .badge').forEach((b) => b.remove());
  const counts = {};
  for (const c of comments) if (c.tab !== 'chat') counts[c.tab] = (counts[c.tab] || 0) + 1;
  for (const [p, n] of Object.entries(counts)) {
    document.querySelector(`.node[data-path="${CSS.escape(p)}"]`)?.insertAdjacentHTML('beforeend', `<span class="badge">${n}</span>`);
  }
}

// ---------- chat feed rendering ----------
let streamEl = null, streamText = '', streamTimer = null, agentCount = 0;
const toolEls = new Map();
let replaying = false; // history being redrawn after (re)connect: old turns, no side effects
let evTs = Date.now(); // timestamp of the event being rendered, so replays keep original times
const now = () => new Date(evTs).toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' });
const atBottom = () => chatPane.scrollHeight - chatPane.scrollTop - chatPane.clientHeight < 80;
function add(el) { const stick = atBottom(); items.append(el); if (stick) chatPane.scrollTop = chatPane.scrollHeight; return el; }
function div(cls, html) { const d = document.createElement('div'); d.className = 'item ' + cls; if (html != null) d.innerHTML = html; return d; }

function newAgentBlock() {
  const d = div('md'); d.dataset.label = t('reply', ++agentCount, now()); return add(d);
}

function toolSummary(name, input) {
  const i = input || {};
  const arg = i.command || i.file_path || i.pattern || i.description || i.url || i.query || i.skill || i.prompt || '';
  return `${name}${arg ? ' · ' + String(arg).split('\n')[0].slice(0, 160) : ''}`;
}

let busy = false;
function setBusy(b) {
  busy = b;
  for (const id of ['restart', 'sessBtn', 'compactBtn', 'clearBtn']) $(id).disabled = b;
  $('stopBtn').disabled = !b;
  $('status').innerHTML = b ? `<span class="spin">●</span> ${t('working')}` : '';
  renderSuggestion(); updateFavicon();
}

// prompt suggestion (SDK promptSuggestions): the predicted next prompt sits in the empty field as a placeholder;
// Tab takes it. Any new user message or a reset makes it stale.
let suggestion = '';
function renderSuggestion() {
  const on = !!suggestion && !busy;
  $('text').placeholder = on ? suggestion : t('composerPh');
  $('text').closest('.ta-wrap').classList.toggle('has-sug', on);
}
const setSuggestion = (s) => { suggestion = (s || '').trim(); renderSuggestion(); };
renderSuggestion();

function onSdk(m) {
  if (m.type === 'prompt_suggestion') return setSuggestion(m.suggestion);
  if (m.type === 'conversation_reset') setSuggestion('');
  if (m.type === 'system' && m.subtype === 'init') { $('session').textContent = `${m.model} · ${m.session_id.slice(0, 8)}`; return; }
  if (m.type === 'system' && m.subtype === 'compact_boundary') {
    const pre = m.compact_metadata?.pre_tokens;
    add(div('done', t('compacted', pre && fmtK(pre), now()))); return;
  }
  if (m.type === 'conversation_reset') {
    // /clear: the old transcript stays in the session picker; here we start from an empty chat
    items.replaceChildren(); sent.length = 0; toolEls.clear(); streamEl = null;
    for (const c of comments) if (c.tab === 'chat') c.range = null;
    renderComments();
    add(div('done', t('cleared', now()))); return;
  }
  if (m.type === 'stream_event' && !m.parent_tool_use_id) {
    const ev = m.event;
    if (ev.type === 'content_block_start' && ev.content_block?.type === 'text') {
      streamEl = newAgentBlock(); streamText = '';
    } else if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta' && streamEl) {
      streamText += ev.delta.text;
      if (!streamTimer) streamTimer = setTimeout(() => { streamTimer = null; if (streamEl) { const s = atBottom(); renderMd(streamEl, streamText, false); if (s) chatPane.scrollTop = chatPane.scrollHeight; } }, 60);
    }
    return;
  }
  if (m.type === 'assistant') {
    const sub = !!m.parent_tool_use_id;
    for (const b of m.message.content || []) {
      if (b.type === 'text' && !sub) {
        const el = streamEl || newAgentBlock();
        streamEl = null; clearTimeout(streamTimer); streamTimer = null;
        renderMd(el, b.text, true);
      } else if (b.type === 'tool_use') {
        toolEls.set(b.id, add(div('tool' + (sub ? ' sub' : ''), esc('▸ ' + toolSummary(b.name, b.input)))));
      }
    }
    return;
  }
  if (m.type === 'user') {
    for (const b of (Array.isArray(m.message?.content) ? m.message.content : [])) {
      if (b.type === 'tool_result' && b.is_error && toolEls.has(b.tool_use_id)) toolEls.get(b.tool_use_id).style.color = 'var(--destructive)';
    }
    return;
  }
  if (m.type === 'result') {
    if (!replaying) { refreshTree(); if (document.hidden || !document.hasFocus()) unseenDone = true; }
    streamEl = null;
    const secs = Math.round((m.duration_ms || 0) / 1000);
    add(div('done', `${t(forcePending ? 'interrupted' : 'done')} · ${secs}s · ${now()}${m.is_error ? ' · ' + esc(m.subtype) : ''}`));
    // the interrupted turn ends here, but the forced message starts a new one
    if (forcePending) forcePending = false; else setBusy(false);
  }
}

let forcePending = false;
function onUser(ev) {
  setSuggestion('');
  if (ev.force) forcePending = true;
  const d = div('user');
  const [general, raw] = ev.text.split(BATCH_RE);
  d.innerHTML = `<div class="meta">${t('you')}${ev.historic ? '' : ' · ' + now()}${ev.force ? t('youForced') : busy ? t('youBusy') : ''}</div>` + linkMentions(esc(general));
  if (ev.comments.length) {
    d.innerHTML += `<details><summary>${t('nComments', ev.comments.length)}</summary>` +
      ev.comments.map((c) => `<blockquote>${esc(c.quote)}</blockquote><div>→ ${esc(c.comment)}</div>`).join('') + `</details>`;
  } else if (raw) {
    // restored from the transcript: only the composed text survives
    d.innerHTML += `<details><summary>${t('commentsLc')}</summary><div style="white-space:pre-wrap">${esc(raw)}</div></details>`;
  }
  if (ev.images?.length) d.append(thumbs(ev.images.map((im) => ({ ...im, url: `data:${im.media_type};base64,${im.data}` }))));
  add(d); chatPane.scrollTop = chatPane.scrollHeight;
  if (!ev.historic) setBusy(true);
}

function onPermission(ev) {
  const d = div('perm'); d.id = 'perm-' + ev.id;
  if (ev.toolName === 'ExitPlanMode' && ev.input?.plan) {
    // plan mode's finale: the plan itself, rendered and commentable like any reply
    d.classList.add('plan');
    d.innerHTML = `<b>${t('planQ')}</b><div class="md"></div>
      <button class="btn primary" data-a="1">${t('approvePlan', t('mode_' + modeBeforePlan))}</button> <button class="btn" data-a="0">${t('keepPlanning')}</button>`;
    d.querySelector('[data-a="1"]').addEventListener('click', () => { restoreAfterPlan = modeBeforePlan; });
    d.dataset.label = t('mode_plan');
    renderMd(d.querySelector('.md'), ev.input.plan, true);
  } else {
    const body = ev.input?.command || ev.input?.file_path || JSON.stringify(ev.input, null, 2);
    d.innerHTML = `<b>${t('allowQ', esc(ev.toolName))}</b><pre>${esc(body)}</pre>
      <button class="btn primary" data-a="1">${t('allow')}</button> <button class="btn" data-a="0">${t('deny')}</button>`;
  }
  d.querySelectorAll('button[data-a]').forEach((b) => b.onclick = () => send({ type: 'permission', id: ev.id, allow: b.dataset.a === '1', input: ev.input }));
  add(d); updateFavicon();
}

function handle(ev) {
  evTs = ev.ts || Date.now();
  if (ev.kind === 'sdk') onSdk(ev.m);
  else if (ev.kind === 'user') onUser(ev);
  else if (ev.kind === 'permission') onPermission(ev);
  else if (ev.kind === 'permission-done') {
    const d = $('perm-' + ev.id);
    if (d) { d.classList.add('resolved'); d.querySelectorAll('button').forEach((b) => b.remove()); d.insertAdjacentHTML('beforeend', t(ev.allow ? 'allowed' : 'denied')); }
    updateFavicon();
  } else if (ev.kind === 'stats') onStats(ev);
  else if (ev.kind === 'resumed') add(div('done', t('resumed', esc(ev.session.slice(0, 8)))));
  else if (ev.kind === 'error') add(div('err', esc(ev.message)));
  else if (ev.kind === 'server-error') toast(t('serverError', ev.where), ev.message);
  else if (ev.kind === 'mode') setModeUI(ev.mode);
}

// the same error repeating (e.g. a request per video frame) bumps a counter instead of stacking toasts
function toast(title, msg) {

    const k = { ArrowDown: 1, ArrowUp: -1 }[e.key];
    if (k) atMove(k);
    else if ((e.key === 'Enter' && !e.shiftKey && !e.metaKey && !e.ctrlKey) || e.key === 'Tab') { if (!at.items.length) return atClose(); atPick(at.sel); }
    else if (e.key === 'Escape') atClose();
    else return;
    e.preventDefault(); e.stopImmediatePropagation();
  }, true);
}
wireMentions($('text')); wireMentions($('popText'));
// in a sent message: @path → click opens the file (paths outside the project just don't open)
const linkMentions = (html) => html.replace(/(^|\s)@(&quot;[^&]+?&quot;|[^\s"&<]+)/g, (m, pre, ref) =>
  `${pre}<span class="mention" data-path="${ref.replace(/&quot;/g, '')}">@${ref}</span>`);
items.addEventListener('click', (e) => { const m = e.target.closest('.user .mention'); if (m && getSelection().isCollapsed && !m.dataset.path.endsWith('/')) openRef(m.dataset.path.replace(/\/$/, ''), m); });

// ---------- composer ----------
let ws;
function send(obj) { ws?.readyState === 1 && ws.send(JSON.stringify(obj)); }
function submit(force) {
  const general = $('text').value.trim();
  if (!general && !comments.length && !composerImgs.length) return;
  const images = composerImgs.map((im, k) => ({ ...im, label: t('imgLabel', k + 1) }));
  const refs = comments.map((c, i) => (c.images || []).map((im) => {
    images.push({ ...im, label: t('imgLabelC', images.length + 1, i + 1) }); return images.length;
  }));
  send({ type: 'send', text: compose(general, refs), comments: comments.map(({ quote, comment, label }) => ({ quote, comment, label })),
    images: images.map(({ media_type, data, label }) => ({ media_type, data, label })), force: force && busy });
  composerImgs.length = 0; renderAttach();
  comments.forEach((c) => { if (c.range) sent.push({ range: c.range, pane: c.pane }); });
  comments.length = 0; renderComments();
  $('text').value = ''; autosize();
  activate('chat');
}
$('send').onclick = () => submit(false);
const autosize = () => { const t = $('text'); t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; };
$('text').addEventListener('input', autosize);
$('text').addEventListener('keydown', (e) => {
  if (e.key === 'Tab' && !e.shiftKey && !$('text').value && suggestion && !busy) {
    e.preventDefault(); $('text').value = suggestion; autosize(); return;
  }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submit(true); }
  else if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(false); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('pop').style.display !== 'block' && busy) send({ type: 'interrupt' });
});

// ---------- connection ----------
fetch('/info').then((r) => r.json()).then((i) => {
  const name = i.root.split('/').pop();
  projName = name; $('proj').textContent = name; $('root').textContent = i.root;
  if (!/·/.test(document.title)) document.title = name + ' · Nota Bene';
  $('restart').hidden = !i.supervised; // only ide.sh can bring the server back
  $('sessBtn').hidden = !i.supervised;
});

// ---------- header stats + /compact /clear ----------
const fmtK = (n) => n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}k` : String(n);
const meter = (label, pct, tip) => {
  const lvl = pct >= 85 ? ' hot' : pct >= 60 ? ' warn' : '';
  return `<span class="meter${lvl}" data-tip="${esc(tip)}">${label} <span class="bar"><i style="width:${Math.min(100, pct)}%"></i></span> ${Math.round(pct)}%</span>`;
};
const resetTip = (r) => r?.resets_at ? t('resets', new Date(r.resets_at).toLocaleString(locale(), { weekday: 'short', hour: '2-digit', minute: '2-digit' })) : '';
let projName = '';
let lastStats = {};
function onStats(st) {
  lastStats = st;
  const parts = [];
  if (st.context) parts.push(meter(t('ctx'), st.context.pct, t('ctxTip', fmtK(st.context.used), fmtK(st.context.max))));
  const L = st.limits;
  if (L?.five_hour?.utilization != null) parts.push(meter(t('h5'), L.five_hour.utilization, `${t('h5Tip')} · ${resetTip(L.five_hour)}`));
  if (L?.seven_day?.utilization != null) parts.push(meter(t('week'), L.seven_day.utilization, `${t('weekTip')} · ${resetTip(L.seven_day)}`));
  if (st.cost != null && !L) parts.push(`<span class="meter" data-tip="${t('costTip')}">$${st.cost.toFixed(2)}</span>`);
  $('stats').innerHTML = parts.join('');
  // the chat tab and the browser tab carry the session name, so several windows can be told apart
  tabs[0].title = st.title || null; renderTabs();
  document.title = `${st.title ? st.title + ' · ' : ''}${projName || 'Nota Bene'}`;
}
$('compactBtn').onclick = () => send({ type: 'command', name: 'compact' });
$('stopBtn').onclick = () => send({ type: 'interrupt' });
// any [data-tip] element gets the same fast tooltip as the card hints (native title is slow and unstyled)
document.addEventListener('mouseover', (e) => {
  const t = e.target.closest('[data-tip]');
  if (t) showTip(t, t.dataset.tip); else if (!e.target.closest('.help')) hideTip();
});
$('clearBtn').onclick = () => {
  if (confirm(t('clearQ'))) send({ type: 'command', name: 'clear' });
};

// ---------- session picker (claude --resume) ----------
const ago = (at) => {
  const m = Math.round((Date.now() - at) / 60000);
  return m < 1 ? t('justNow') : m < 60 ? t('minAgo', m) : m < 1440 ? t('hAgo', Math.round(m / 60)) : new Date(at).toLocaleDateString(locale(), { day: 'numeric', month: 'short' });
};
const kb = (n) => n == null ? '' : n > 1e6 ? `${(n / 1e6).toFixed(1)} ${t('mb')}` : `${Math.round(n / 1e3)} ${t('kb')}`;
let sessRoot = '';
function switchSession(id, title, dir) {
  const other = dir && dir !== sessRoot;
  const what = id ? t('openQ', title) : t('newQ');
  const move = other ? t('moveQ', dir) : '';
  if (!confirm(what + move + t('switchWarn'))) return;
  $('sessMenu').style.display = 'none'; $('conn').textContent = t('switching');
  fetch(`/switch?id=${encodeURIComponent(id || '')}&dir=${encodeURIComponent(dir || sessRoot)}`, { method: 'POST' })
    .then(async (r) => { if (!r.ok) { $('conn').textContent = ''; alert(t('switchFail') + await r.text()); } }, () => {});
}
$('sessBtn').onclick = async () => {
  const menu = $('sessMenu');
  if (menu.style.display === 'block') { menu.style.display = 'none'; return; }
  menu.innerHTML = `<div class="note">${t('loading')}</div>`;
  menu.style.left = `${Math.max(8, Math.min($('sessBtn').getBoundingClientRect().right - 460, innerWidth - 468))}px`; menu.style.display = 'block';
  const { current, root, sessions } = await fetch('/sessions').then((r) => r.json());
  sessRoot = root;
  // this project first, then other folders by their latest activity
  const groups = new Map([[root, []]]);
  for (const x of sessions) { if (!groups.has(x.cwd)) groups.set(x.cwd, []); groups.get(x.cwd).push(x); }
  const short = (d) => d.replace(/^\/Users\/[^/]+/, '~');
  const item = (x) => `<button class="item-s${x.id === current ? ' cur' : ''}" data-id="${x.id}" data-dir="${esc(x.cwd)}" data-q="${esc((x.title + ' ' + x.cwd).toLowerCase())}">
      <span class="t">${esc(x.title || t('untitled'))}</span>
      <span class="m">${x.id.slice(0, 8)} · ${ago(x.at)} · ${kb(x.size)}${x.id === current ? t('openNow') : ''}</span></button>`;
  menu.innerHTML = `<input id="sessFilter" placeholder="${t('sessFilter')}">
    <button class="item-s" data-id="" data-dir="${esc(root)}" data-q=""><span class="t">${t('newHere')}</span></button>` +
    [...groups].filter(([, xs]) => xs.length).map(([dir, xs]) =>
      `<div class="grp${dir === root ? ' here' : ''}" title="${esc(dir)}">${dir === root ? t('thisProject') : ''}${esc(short(dir))}</div>${xs.map(item).join('')}`).join('');
  menu.querySelectorAll('.item-s').forEach((b) => {
    if (b.classList.contains('cur')) return;
    b.onclick = () => switchSession(b.dataset.id, b.querySelector('.t').textContent, b.dataset.dir);
  });
  const f = $('sessFilter'); f.focus();
  f.oninput = () => {
    const q = f.value.trim().toLowerCase();
    menu.querySelectorAll('.item-s[data-id]:not([data-id=""])').forEach((b) => { b.hidden = !!q && !b.dataset.q.includes(q); });
    menu.querySelectorAll('.grp').forEach((g) => {
      let n = g.nextElementSibling, any = false;
      while (n && n.classList.contains('item-s')) { any ||= !n.hidden; n = n.nextElementSibling; }
      g.hidden = !any;
    });
  };
};
document.addEventListener('mousedown', (e) => { if (!e.target.closest('#sessMenu, #sessBtn')) $('sessMenu').style.display = 'none'; });
$('restart').onclick = () => { $('conn').textContent = t('restarting'); fetch('/restart', { method: 'POST' }); };
function connect() {
  ws = new WebSocket(`ws://${location.host}`);
  ws.onopen = () => { $('conn').textContent = ''; };
  ws.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.kind === 'replay') { items.innerHTML = ''; agentCount = 0; streamEl = null; forcePending = false; setBusy(false); replaying = true; ev.events.forEach(handle); replaying = false; chatPane.scrollTop = chatPane.scrollHeight; }
    else handle(ev);
  };
  ws.onclose = () => { $('conn').textContent ||= t('offline'); setTimeout(connect, 1000); };
}
// chrome re-renders at once; lines already in the chat feed keep their language until the next reload
$('langBtn').onclick = () => {
  lang = lang === 'ru' ? 'en' : 'ru'; localStorage.setItem('lang', lang);
  applyLang(); renderComments(); onStats(lastStats); setBusy(busy); hideTip(); if (mode) setModeUI(mode); // setBusy → renderSuggestion: placeholder in the new language
};
renderTabs(); renderComments(); loadDir('', $('tree'), 0); connect();
// restore panels last: renderTabs needs `comments`, declared further down
togglePanel('side', localStorage.getItem('panel:side') !== '0');
togglePanel('comments', localStorage.getItem('panel:comments') === '1');
</script>
</body>
